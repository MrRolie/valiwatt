name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.9"
      - name: Install
        run: uv sync --locked
      - name: Public-safety scan
        run: uv run valiwatt safety
      - name: Tests, including every injected break (offline)
        run: uv run pytest -m "not network"
