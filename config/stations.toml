# Weather station panel: one primary ECCC station per major population centre of Québec.
#
# Demand is province-wide and winter demand follows heating, so the panel samples where people live. Montréal is the
# primary station named in the brief. Stations were picked by population centre, taking each centre's main airport or
# regional station. Their coverage is not asserted here: the data-quality run measures it and gates it (report §4).
# `reason_fr` is the French wording of `reason`, for the French report; keep the two together.
# climate_id and station_id come from ECCC's climate-stations inventory (api.weather.gc.ca, collection climate-stations).

[[station]]
key = "montreal"
name = "MONTREAL INTL A"
climate_id = "7025251"
station_id = 51157
centre = "Montréal"
primary = true
reason = "Primary station named in the brief; the largest population centre."
reason_fr = "Station principale nommée au dossier de départ ; le plus grand centre de population."

